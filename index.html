<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kegeltour Karte</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { height: 100%; width: 100%; }
    
    /* Marker */
    .custom-marker {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      color: #fff;
      font-size: 18px;
    }
    
    .nav-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      width: calc(100% - 24px);
    }

    /* Floating Menu Button */
    #menu-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      width: 44px;
      height: 44px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
    }

    /* Abdunklungshintergrund */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1050;
    }
    #backdrop.active { display: block; }

    /* Ausklappbare Seitenleiste */
    #sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 290px;
      height: 100%;
      background: #ffffff;
      z-index: 1100;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      transition: right 0.25s ease-in-out;
      display: flex;
      flex-direction: column;
    }
    #sidebar.active { right: 0; }

    /* Header im Menü mit Logo */
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-header img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 6px;
    }
    .sidebar-title {
      flex: 1;
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #777;
    }

    /* Scrollbare Liste */
    #poi-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      margin: 0;
      list-style: none;
    }
    .poi-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .poi-item:active {
      background-color: #f0f0f0;
    }
    .poi-item-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }
    .poi-item-text {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<button id="menu-btn"><i class="mdi mdi-menu"></i></button>

<div id="backdrop"></div>

<div id="sidebar">
  <div class="sidebar-header">
    <!-- Lege eine logo.png in dein Repo oder passe den Pfad an -->
    <img src="./logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23555\'><circle cx=\'12\' cy=\'12\' r=\'10\'/></svg>'">
    <div class="sidebar-title">Kegeltour Amsterdam</div>
    <button class="close-btn" id="close-btn"><i class="mdi mdi-close"></i></button>
  </div>
  <ul id="poi-list"></ul>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([52.3637, 4.8821], 15);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // UI-Logik für Seitenleiste
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const poiList = document.getElementById('poi-list');

  function openSidebar() {
    sidebar.classList.add('active');
    backdrop.classList.add('active');
  }
  function closeSidebar() {
    sidebar.classList.remove('active');
    backdrop.classList.remove('active');
  }

  document.getElementById('menu-btn').onclick = openSidebar;
  document.getElementById('close-btn').onclick = closeSidebar;
  backdrop.onclick = closeSidebar;

  function createCustomIcon(iconName, color) {
    return L.divIcon({
      className: 'custom-div-icon',
      html: `<div class="custom-marker" style="background-color: ${color};"><i class="mdi ${iconName}"></i></div>`,
      iconSize: [36, 36],
      iconAnchor: [18, 18],
      popupAnchor: [0, -20]
    });
  }

  function getNavUrl(lat, lng) {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent)
      ? `https://maps.apple.com/?daddr=${lat},${lng}`
      : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  }

  // POIs laden & Liste generieren
  fetch(`./pois.json?v=${Date.now()}`)
    .then(res => res.json())
    .then(pois => {
      pois.forEach(poi => {
        const marker = L.marker([poi.lat, poi.lng], { 
          icon: createCustomIcon(poi.icon, poi.color) 
        }).addTo(map);

        const navUrl = getNavUrl(poi.lat, poi.lng);
        marker.bindPopup(`
          <div style="min-width: 160px; font-family: sans-serif;">
            <h3 style="margin: 0 0 6px 0; font-size: 15px;">${poi.title}</h3>
            <p style="margin: 0 0 8px 0; font-size: 13px; color: #555;">${poi.desc}</p>
            <a href="${navUrl}" target="_blank" rel="noopener" class="nav-btn">Route starten</a>
          </div>
        `);

        // Eintrag für Sidebar-Liste erstellen
        const li = document.createElement('li');
        li.className = 'poi-item';
        li.innerHTML = `
          <div class="poi-item-icon" style="background-color: ${poi.color};">
            <i class="mdi ${poi.icon}"></i>
          </div>
          <div class="poi-item-text">${poi.title}</div>
        `;

        li.onclick = () => {
          closeSidebar();
          map.flyTo([poi.lat, poi.lng], 17, { duration: 0.8 });
          marker.openPopup();
        };

        poiList.appendChild(li);
      });
    })
    .catch(err => console.error("Fehler beim Laden der Orte:", err));

  // Live-Standort Nutzer
  map.locate({ setView: false, watch: true, enableHighAccuracy: true });
  let userMarker = null;

  map.on('locationfound', (e) => {
    if (!userMarker) {
      userMarker = L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: '#000',
        color: '#fff',
        weight: 2,
        opacity: 1,
        fillOpacity: 1
      }).addTo(map).bindPopup("Dein Standort");
    } else {
      userMarker.setLatLng(e.latlng);
    }
  });
</script>

</body>
</html>
